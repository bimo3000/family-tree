<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:"
    />
    <title>Mock-up B · Klar & modern</title>
    <link rel="stylesheet" href="shared/base.css" />
    <style>
      /* Variant B: clean and modern. Compact cards with a round photo and a subtle gender edge, editing in a dialog. */
      :root {
        --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --bg: #ffffff;
        --canvas: #f4f6f8;
        --ink: #1f2933;
        --muted: #637080;
        --line: #b4bec8;
        --line-hl: #2f6f8f;
        --line-soft: #e3e8ed;
        --bar-bg: #ffffff;
        --bar-border: #e3e8ed;
        --panel-bg: #ffffff;
        --hover: #eef2f5;
        --card-bg: #ffffff;
        --card-border: #dde3e8;
        --card-shadow: 0 1px 2px rgba(16, 24, 40, 0.07);
        --card-shadow-hover: 0 4px 14px rgba(16, 24, 40, 0.14);
        --accent: #2f6f8f;
        --accent-ink: #ffffff;
        --btn-bg: #ffffff;
        --btn-border: #d0d7de;
        --warn: #b4541a;
        --danger: #c0392b;
        --ph-bg: #e6ecf1;
        --ph-ink: #4b5a68;
        --tip-bg: #1f2933;
        --tip-ink: #ffffff;
        --female: #e08fa6;
        --male: #6f9fd6;
        --diverse: #a08fd6;
        --radius: 12px;
        --shadow: 0 12px 32px rgba(16, 24, 40, 0.16);
        --card-w: 220;
        --card-h: 68;
        --slot-w: 248;
        --row-h: 170;
      }
      .p-photo {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        margin: 14px 0 6px;
      }
      .panel h3 {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .btn {
        border-radius: 999px;
      }
    </style>
  </head>
  <body class="card-row g-edge" data-variant="b" data-edit-mode="dialog">
    <script src="shared/familie.js"></script>
    <script src="shared/prototype.js"></script>
  </body>
</html>
